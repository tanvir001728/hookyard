openapi: 3.1.0
info:
  title: Hookyard API
  version: 0.1.0
  summary: Reliable delivery for outbound API calls.
  description: |
    Hookyard delivers outbound HTTP requests to third-party APIs ("upstreams") on behalf of your
    applications, with retries, backoff and a dead-letter queue.

    ## Concepts

    - **Upstream**: a third-party API configured in Hookyard (base URL, credentials, retry policy).
      Applications refer to upstreams by name and never handle vendor URLs or credentials.
    - **Request**: one outbound call that an application asked Hookyard to deliver.
    - **Attempt**: one HTTP try of a request.
    - **Dead-letter queue (DLQ)**: requests in the `dead` state that exhausted their retries or failed
      permanently. They can be inspected and replayed.

    ## Conventions

    - **Authentication**: every `/v1` endpoint requires `Authorization: Bearer <token>`.
    - **Durations** are strings with a unit, for example `"500ms"`, `"30s"`, `"5m"` or `"2h"`.
    - **Timestamps** are RFC 3339 in UTC.
    - **Errors** always use the `Error` schema, and `error.code` is stable and safe to branch on.
    - **Pagination** is cursor based: pass `next_cursor` from a response as `cursor` to get the next page.

    ## Delivery

    - Network errors, timeouts, `408`, `425`, `429` and `5xx` responses are retried with exponential
      backoff and full jitter. A `Retry-After` header on `429` or `503` sets the delay.
    - Other `4xx` responses and `3xx` redirects (never followed) are permanent failures: the request
      moves to the dead-letter queue immediately.
    - Every delivery carries `Hookyard-Request-Id` and `Hookyard-Attempt` headers, which upstreams can
      use to detect retries.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Hookyard
    url: https://github.com/tanvir001728/hookyard

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Requests
    description: Enqueue outbound requests and inspect their delivery.
  - name: Dead-letter queue
    description: Inspect and replay requests that could not be delivered.
  - name: Callbacks
    description: Signed events Hookyard sends to your app when a request finishes.
  - name: Upstreams
    description: Configured third-party APIs.
  - name: Stats
    description: Delivery metrics per upstream.
  - name: Health
    description: Liveness and readiness probes.

paths:
  /v1/requests:
    post:
      operationId: createRequest
      tags: [Requests]
      summary: Enqueue a request
      description: |
        Queues an outbound request for delivery and returns immediately.

        If `dedupe_key` is set and a request with the same key already exists for the same upstream
        (within the dedupe window, 24 hours by default), no new request is created. The existing request
        is returned with status `200` and the `Hookyard-Deduplicated: true` header. This makes it
        safe for applications to retry the enqueue call itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
            examples:
              minimal:
                summary: Minimal request
                value:
                  upstream: courier-x
                  method: POST
                  path: /shipments
                  body: { order_id: 123 }
              full:
                summary: All options
                value:
                  upstream: courier-x
                  method: POST
                  path: /shipments?notify=true
                  headers: { X-Correlation-Id: 7f3c1e }
                  body: { order_id: 123, weight_kg: 2.5 }
                  dedupe_key: order-123-create-shipment
                  deliver_at: "2026-10-01T10:00:00Z"
                  timeout: 15s
                  retry: patient
                  tags: { app: orders, tenant: acme }
      responses:
        "202":
          description: The request was queued.
          headers:
            Location:
              description: URL of the created request.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "200":
          description: A request with the same `dedupe_key` already exists; it is returned unchanged.
          headers:
            Hookyard-Deduplicated:
              description: Always `true` for this response.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listRequests
      tags: [Requests]
      summary: List requests
      description: Lists requests, newest first. All filters are combined with AND.
      parameters:
        - $ref: "#/components/parameters/Upstream"
        - name: status
          in: query
          description: Filter by one or more statuses, comma separated.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RequestStatus"
          example: [dead, failed]
        - name: tag
          in: query
          description: Filter by tag, as `key:value`. Repeat the parameter to match several tags.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, pattern: "^[^:]+:.*$" }
          example: ["app:orders"]
        - name: dedupe_key
          in: query
          description: Filter by exact dedupe key.
          schema: { type: string }
        - $ref: "#/components/parameters/CreatedAfter"
        - $ref: "#/components/parameters/CreatedBefore"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/requests/{id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getRequest
      tags: [Requests]
      summary: Get a request
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/requests/{id}/attempts:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listAttempts
      tags: [Requests]
      summary: List delivery attempts
      description: Returns every delivery attempt of a request, oldest first.
      responses:
        "200":
          description: The attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/requests/{id}/replay:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: replayRequest
      tags: [Requests]
      summary: Replay a request
      description: |
        Queues a finished request (`dead`, `succeeded`, `canceled` or `unknown`) for delivery again with a
        fresh retry budget. Previous attempts are kept. Replaying a request that is still in progress
        returns `409`.
      responses:
        "202":
          description: The request was queued again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/requests/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: cancelRequest
      tags: [Requests]
      summary: Cancel a request
      description: |
        Cancels a request that has not finished (`scheduled`, `pending` or `failed`). A request that is
        `in_flight` cannot be canceled, because the call to the upstream may already have been sent.
      responses:
        "200":
          description: The request was canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/requests/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: resolveRequest
      tags: [Requests]
      summary: Settle a request whose outcome is unknown
      description: |
        A request is `unknown` when it was sent but no response arrived, so Hookyard can't tell whether
        the upstream processed it. After checking with the upstream, record what happened: `succeeded`,
        or `dead` (it didn't go through; it moves to the dead-letter queue, where it can be replayed).
        Only `unknown` requests can be resolved. Recorded in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [succeeded, dead]
                reason:
                  type: string
                  description: Why, for the audit log.
            example:
              outcome: succeeded
              reason: The vendor's dashboard shows the charge.
      responses:
        "200":
          description: The resolved request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/requests/{id}/callbacks:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listCallbacks
      tags: [Callbacks]
      summary: List completion callbacks
      description: |
        Returns the callbacks sent (or being sent) for a request, oldest first. A request gets one each
        time it reaches a final state with a callback URL set; a replayed request can have several.
      responses:
        "200":
          description: The callbacks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/requests/{id}/callbacks/{callback_id}/retry:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: callback_id
        in: path
        required: true
        schema:
          type: string
          example: evt_0f6a3c2b9d8e4f5a8b7c6d5e4f3a2b1c
    post:
      operationId: retryCallback
      tags: [Callbacks]
      summary: Retry a failed callback
      description: |
        Sends a `failed` callback again, with a fresh attempt budget. The event (its id and body) is
        unchanged, so receivers that deduplicate on `webhook-id` handle it once. Recorded in the audit
        log.
      responses:
        "202":
          description: The callback was queued again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Callback"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/dlq:
    get:
      operationId: getDLQSummary
      tags: [Dead-letter queue]
      summary: Summarize the dead-letter queue
      description: |
        Groups dead requests by upstream and failure reason. Use `GET /v1/requests?status=dead` to list
        the individual requests.
      parameters:
        - $ref: "#/components/parameters/Upstream"
      responses:
        "200":
          description: DLQ groups, largest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/dlq/replay:
    post:
      operationId: replayDLQ
      tags: [Dead-letter queue]
      summary: Replay dead requests in bulk
      description: |
        Queues every dead request that matches the filter for delivery again. Filters are combined with
        AND. An empty filter matches the whole DLQ, so use `dry_run` first to see how many requests
        would be replayed. The operation is idempotent: requests that were already replayed are no
        longer dead and are not matched again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DLQReplayRequest"
            examples:
              byReason:
                summary: Replay timeouts for one upstream from the last two hours
                value:
                  upstream: courier-x
                  error_code: timeout
                  dead_after: "2026-09-29T08:00:00Z"
              dryRun:
                summary: Count without replaying
                value:
                  upstream: courier-x
                  dry_run: true
      responses:
        "200":
          description: The replay result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQReplayResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/upstreams:
    get:
      operationId: listUpstreams
      tags: [Upstreams]
      summary: List upstreams
      responses:
        "200":
          description: All configured upstreams, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/upstreams/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Upstream name.
        schema:
          $ref: "#/components/schemas/UpstreamName"
    get:
      operationId: getUpstream
      tags: [Upstreams]
      summary: Get an upstream
      description: Returns the effective configuration of an upstream. Secret values are never returned.
      responses:
        "200":
          description: The upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/upstreams/{name}/pause:
    parameters:
      - $ref: "#/components/parameters/UpstreamName"
    post:
      operationId: pauseUpstream
      tags: [Upstreams]
      summary: Pause deliveries to an upstream
      description: |
        Requests to a paused upstream wait in the queue: they don't use up attempts, and the paused time
        doesn't count against their `max_age`. The pause survives restarts. Set `until` or `duration`
        to end it automatically; pausing again updates the reason and end time. Recorded in the audit
        log and the upstream's events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
                until:
                  type: string
                  format: date-time
                  description: End the pause at this time (at most 30 days ahead).
                duration:
                  $ref: "#/components/schemas/Duration"
            example:
              reason: Vendor maintenance window
              duration: 2h
      responses:
        "200":
          description: The upstream, now paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/upstreams/{name}/resume:
    parameters:
      - $ref: "#/components/parameters/UpstreamName"
    post:
      operationId: resumeUpstream
      tags: [Upstreams]
      summary: Resume deliveries to a paused upstream
      description: Waiting requests are delivered again, with the paused time credited to their `max_age`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The upstream, resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/upstreams/{name}/events:
    parameters:
      - $ref: "#/components/parameters/UpstreamName"
    get:
      operationId: listUpstreamEvents
      tags: [Upstreams]
      summary: Upstream history
      description: Circuit breaker transitions, pauses and resumes, newest first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UpstreamEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/stats/overview:
    get:
      operationId: getStatsOverview
      tags: [Stats]
      summary: Per-upstream health overview
      parameters:
        - name: window
          in: query
          description: How far back to aggregate.
          schema:
            $ref: "#/components/schemas/Duration"
            default: 1h
      responses:
        "200":
          description: One entry per upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/stats/timeseries:
    get:
      operationId: getStatsTimeseries
      tags: [Stats]
      summary: Delivery metrics over time
      parameters:
        - $ref: "#/components/parameters/Upstream"
        - name: from
          in: query
          description: Start of the range. Defaults to one hour before `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the range. Defaults to now.
          schema: { type: string, format: date-time }
        - name: step
          in: query
          description: |
            Bucket size, rounded up to whole minutes. Buckets start at `from` (rounded down to the
            minute). A range may have at most 1500 buckets.
          schema:
            $ref: "#/components/schemas/Duration"
            default: 1m
      responses:
        "200":
          description: Time buckets, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsTimeseries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/InternalError"

  /healthz:
    get:
      operationId: healthz
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      operationId: readyz
      tags: [Health]
      summary: Readiness probe
      description: Reports whether every dependency (such as the database) is reachable.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one dependency check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

webhooks:
  requestFinished:
    post:
      operationId: requestFinished
      tags: [Callbacks]
      summary: A request finished
      description: |
        Sent to the request's `callback_url` when it reaches a final state. Signed following
        [Standard Webhooks](https://www.standardwebhooks.com/): verify `webhook-signature` (HMAC-SHA256
        over `{webhook-id}.{webhook-timestamp}.{body}` with your `whsec_` secret) and reject old
        timestamps. Answer with any 2xx status; anything else, or no answer within the timeout, is
        retried with backoff. Delivery is at least once: deduplicate on `webhook-id`.
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema:
            type: string
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix seconds when this attempt was sent.
          schema:
            type: string
        - name: webhook-signature
          in: header
          required: true
          description: One or more space-separated `v1,<base64>` signatures, one per configured secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackEvent"
      responses:
        "2XX":
          description: The app accepted the event.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token configured in Hookyard.

  parameters:
    UpstreamName:
      name: name
      in: path
      required: true
      description: Upstream name.
      schema:
        $ref: "#/components/schemas/UpstreamName"
    RequestId:
      name: id
      in: path
      required: true
      description: Request ID.
      schema:
        $ref: "#/components/schemas/RequestId"
    Upstream:
      name: upstream
      in: query
      description: Only include this upstream.
      schema:
        $ref: "#/components/schemas/UpstreamName"
    CreatedAfter:
      name: created_after
      in: query
      description: Only include requests created at or after this time.
      schema: { type: string, format: date-time }
    CreatedBefore:
      name: created_before
      in: query
      description: Only include requests created before this time.
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `next_cursor`.
      schema: { type: string }

  responses:
    BadRequest:
      description: |
        The request is malformed: invalid JSON, unknown fields or bad query parameters. Request
        bodies are always parsed as JSON, whatever the `Content-Type` header says.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: bad_request
              message: "invalid query parameter \"limit\": must be between 1 and 200"
    Unauthorized:
      description: The bearer token is missing or invalid.
      headers:
        WWW-Authenticate:
          description: Always `Bearer realm="hookyard"`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: unauthorized, message: missing or invalid bearer token }
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: not_found, message: "request \"req_01J9ZK3Q4W5E6R7T8Y9U0I1O2P\" not found" }
    Conflict:
      description: The resource is not in a state that allows this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: invalid_state, message: "cannot cancel a request that is in_flight" }
    PayloadTooLarge:
      description: The request body exceeds the configured limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: payload_too_large, message: request body exceeds 1 MiB }
    UnprocessableEntity:
      description: The request is well formed but fails validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unknownUpstream:
              summary: Unknown upstream
              value:
                error:
                  code: unknown_upstream
                  message: "upstream \"courier-y\" is not configured (did you mean \"courier-x\"?)"
            validation:
              summary: Invalid fields
              value:
                error:
                  code: validation_failed
                  message: 2 fields are invalid
                  details:
                    - { field: path, message: "must start with \"/\"" }
                    - { field: retry.max_attempts, message: must be between 1 and 100 }
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: internal, message: internal server error }

  schemas:
    RequestId:
      type: string
      description: Unique request ID, prefixed with `req_`.
      pattern: "^req_[0-9A-Za-z]+$"
      example: req_01J9ZK3Q4W5E6R7T8Y9U0I1O2P

    UpstreamName:
      type: string
      description: Name of a configured upstream.
      pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      example: courier-x

    Duration:
      type: string
      description: A duration with a unit (`ms`, `s`, `m`, `h`), for example `"30s"` or `"1h30m"`.
      pattern: "^([0-9]+(\\.[0-9]+)?(ms|s|m|h))+$"
      example: 30s

    HTTPMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE]

    Headers:
      type: object
      description: HTTP headers. Header names are case-insensitive.
      additionalProperties: { type: string }
      example: { X-Correlation-Id: 7f3c1e }

    Tags:
      type: object
      description: |
        Free-form labels for filtering and grouping, for example the calling app or tenant.
        Up to 20 tags; keys up to 64 characters, values up to 256 characters.
      maxProperties: 20
      propertyNames: { type: string, minLength: 1, maxLength: 64 }
      additionalProperties: { type: string, maxLength: 256 }
      example: { app: orders, tenant: acme }

    RequestStatus:
      type: string
      description: |
        - `scheduled`: waiting for `deliver_at`
        - `pending`: waiting to be picked up by a worker
        - `in_flight`: being delivered right now
        - `failed`: the last attempt failed and a retry is scheduled (see `next_attempt_at`)
        - `succeeded`: delivered successfully (final)
        - `dead`: retries exhausted or a permanent error; in the DLQ (final)
        - `unknown`: the request was sent but no response arrived, so the upstream may or may not have
          processed it; not retried to avoid a duplicate. Settle it with `resolve`, or `replay` it (final)
        - `canceled`: canceled before delivery (final)
      enum: [scheduled, pending, in_flight, failed, succeeded, dead, unknown, canceled]

    RetryPreset:
      type: string
      description: |
        Named retry policy:

        | Preset | Attempts | Initial interval | Max interval | Max age |
        | --- | --- | --- | --- | --- |
        | `none` | 1 | – | – | – |
        | `quick` | 5 | 1s | 30s | 10m |
        | `standard` | 10 | 5s | 10m | 24h |
        | `patient` | 25 | 30s | 1h | 72h |
      enum: [none, quick, standard, patient]
      default: standard

    RetryPolicyObject:
      type: object
      description: |
        A custom retry policy. Unset fields come from `preset` (if set), then from the upstream's
        policy. Delays grow exponentially and use full jitter:
        `delay = random(0, min(max_interval, initial_interval * multiplier^(attempt-1)))`.
        A `Retry-After` header from the upstream always takes precedence.
      additionalProperties: false
      properties:
        preset:
          $ref: "#/components/schemas/RetryPreset"
        max_attempts:
          type: integer
          description: Total attempts including the first one.
          minimum: 1
          maximum: 100
        initial_interval:
          $ref: "#/components/schemas/Duration"
        max_interval:
          $ref: "#/components/schemas/Duration"
        multiplier:
          type: number
          minimum: 1
          maximum: 10
        max_age:
          allOf:
            - $ref: "#/components/schemas/Duration"
          description: |
            Give up (move to the DLQ) once this much time has passed since the request became due: its
            creation time, or `deliver_at` for scheduled requests.
      example:
        preset: standard
        max_attempts: 5
        max_interval: 2m

    RetryPolicy:
      description: A retry preset name, or a custom policy.
      oneOf:
        - $ref: "#/components/schemas/RetryPreset"
        - $ref: "#/components/schemas/RetryPolicyObject"

    EffectiveRetryPolicy:
      type: object
      description: A fully resolved retry policy.
      required: [max_attempts, initial_interval, max_interval, multiplier, max_age]
      properties:
        preset:
          $ref: "#/components/schemas/RetryPreset"
        max_attempts: { type: integer }
        initial_interval: { $ref: "#/components/schemas/Duration" }
        max_interval: { $ref: "#/components/schemas/Duration" }
        multiplier: { type: number }
        max_age: { $ref: "#/components/schemas/Duration" }

    CreateRequest:
      type: object
      additionalProperties: false
      required: [upstream, method, path]
      properties:
        upstream:
          $ref: "#/components/schemas/UpstreamName"
        method:
          $ref: "#/components/schemas/HTTPMethod"
        path:
          type: string
          description: Path (and optional query string) appended to the upstream's base URL.
          pattern: "^/"
          maxLength: 2048
          example: /shipments?notify=true
        headers:
          allOf:
            - $ref: "#/components/schemas/Headers"
          description: |
            Headers for this request. Headers configured on the upstream (typically credentials) take
            precedence. `Host`, `Content-Length` and hop-by-hop headers can't be set.
        body:
          description: |
            Request body. A JSON object, array, number or boolean is sent as JSON with
            `Content-Type: application/json`. A string is sent verbatim, so set a `Content-Type` header
            for other formats (for example XML or form data). Omit it, or use `null`, to send no body.
        dedupe_key:
          type: string
          description: |
            Makes enqueueing idempotent. While a request with the same key exists for the same upstream
            (within the dedupe window), enqueueing again returns that request instead of creating a new
            one.
          minLength: 1
          maxLength: 256
          example: order-123-create-shipment
        deliver_at:
          type: string
          format: date-time
          description: Deliver no earlier than this time. The request stays `scheduled` until then.
        timeout:
          allOf:
            - $ref: "#/components/schemas/Duration"
          description: Per-attempt timeout. Overrides the upstream's timeout.
        retry:
          $ref: "#/components/schemas/RetryPolicy"
        tags:
          $ref: "#/components/schemas/Tags"
        callback_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Where to POST a signed event when the request finishes (see the `requestFinished` webhook).
            Overrides the upstream's `callback_url`; an empty string turns callbacks off for this request.
            Must match `callbacks.allow` in `hookyard.yaml` when that is set, and requires
            `HOOKYARD_CALLBACK_SECRETS` on the server.
          example: http://orders-svc:3000/hooks/hookyard
        on_result:
          type: string
          minLength: 1
          maxLength: 128
          description: An app-defined key carried in the callback event, to route it to a handler.
          example: order.shipment

    Request:
      type: object
      required: [id, upstream, method, path, status, attempt_count, retry, tags, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/RequestId"
        upstream:
          $ref: "#/components/schemas/UpstreamName"
        method:
          $ref: "#/components/schemas/HTTPMethod"
        path:
          type: string
          example: /shipments
        headers:
          $ref: "#/components/schemas/Headers"
        body:
          description: The body as it was enqueued.
        dedupe_key:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/RequestStatus"
        attempt_count:
          type: integer
          description: Number of attempts made so far.
          minimum: 0
        retry:
          $ref: "#/components/schemas/EffectiveRetryPolicy"
        timeout:
          $ref: "#/components/schemas/Duration"
        tags:
          $ref: "#/components/schemas/Tags"
        deliver_at:
          type: [string, "null"]
          format: date-time
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: When the next attempt is due, for `scheduled`, `pending` and `failed` requests.
        last_error:
          oneOf:
            - $ref: "#/components/schemas/DeliveryError"
            - type: "null"
          description: Why the most recent attempt failed, if it did.
        last_status_code:
          type: [integer, "null"]
          description: HTTP status code of the most recent response, if any.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the request reached a final state.
        callback_url:
          type: [string, "null"]
          description: Where the completion callback goes, or `null` for none.
        on_result:
          type: [string, "null"]
          description: The routing key carried in the callback event.

    RequestList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Request"
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or `null` on the last page.

    Callback:
      type: object
      description: One completion event and its delivery to the application.
      required: [id, request_id, type, url, request_status, status, attempt_count, created_at]
      properties:
        id:
          type: string
          description: The event id, sent as `webhook-id`. The same on every attempt.
          example: evt_0f6a3c2b9d8e4f5a8b7c6d5e4f3a2b1c
        request_id:
          $ref: "#/components/schemas/RequestId"
        type:
          $ref: "#/components/schemas/CallbackEventType"
        url:
          type: string
        request_status:
          $ref: "#/components/schemas/RequestStatus"
        status:
          type: string
          enum: [pending, delivering, delivered, failed]
          description: |
            `pending` (waiting for its first or next attempt), `delivering`, `delivered` (the app answered
            2xx) or `failed` (every attempt failed; retry it with `retryCallback`).
        attempt_count:
          type: integer
          minimum: 0
        next_attempt_at:
          type: [string, "null"]
          format: date-time
        last_status_code:
          type: [integer, "null"]
        last_error:
          type: [string, "null"]
        last_attempt_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: [string, "null"]
          format: date-time

    CallbackList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Callback"

    CallbackEventType:
      type: string
      enum: [request.succeeded, request.dead, request.unknown, request.canceled]

    CallbackEvent:
      type: object
      description: The body of a completion callback.
      required: [type, timestamp, data]
      properties:
        type:
          $ref: "#/components/schemas/CallbackEventType"
        timestamp:
          type: string
          format: date-time
          description: When the request finished.
        data:
          type: object
          required: [request_id, upstream, method, path, status, on_result, tags, dedupe_key, attempt_count, last_error, response, completed_at]
          properties:
            request_id:
              $ref: "#/components/schemas/RequestId"
            upstream:
              $ref: "#/components/schemas/UpstreamName"
            method:
              $ref: "#/components/schemas/HTTPMethod"
            path:
              type: string
            status:
              $ref: "#/components/schemas/RequestStatus"
            on_result:
              type: [string, "null"]
            tags:
              $ref: "#/components/schemas/Tags"
            dedupe_key:
              type: [string, "null"]
            attempt_count:
              type: integer
              minimum: 0
            last_error:
              oneOf:
                - $ref: "#/components/schemas/DeliveryError"
                - type: "null"
            response:
              description: The upstream's last response, if one arrived.
              oneOf:
                - type: "null"
                - type: object
                  required: [status_code, headers, body, body_truncated]
                  properties:
                    status_code:
                      type: integer
                    headers:
                      $ref: "#/components/schemas/Headers"
                    body:
                      type: string
                    body_truncated:
                      type: boolean
            completed_at:
              type: [string, "null"]
              format: date-time

    DeliveryErrorCode:
      type: string
      description: |
        - `timeout`: no response within the attempt timeout
        - `connection`: DNS, TCP or TLS failure
        - `http_status`: the upstream responded with a status classified as a failure
        - `classified_failure`: the status meant success, but a classification rule matched the
          response (for example `"status": "FAILED"` in a `200` body) and counted it as a failure
        - `max_age_exceeded`: the request's `max_age` passed before it could be delivered
        - `canceled`: the request was canceled
        - `internal`: an unexpected error inside Hookyard
      enum: [timeout, connection, http_status, classified_failure, max_age_exceeded, canceled, internal]

    DeliveryError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/DeliveryErrorCode"
        message:
          type: string
          example: upstream responded with 503 Service Unavailable

    Attempt:
      type: object
      required: [number, started_at, duration_ms, outcome]
      properties:
        number:
          type: integer
          description: 1 for the first attempt.
          minimum: 1
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        outcome:
          type: string
          description: |
            How Hookyard classified the attempt. `unknown` means the request was sent but no response
            arrived (see the request's `unknown` status).
          enum: [success, retryable_failure, permanent_failure, unknown]
        status_code:
          type: [integer, "null"]
        error:
          oneOf:
            - $ref: "#/components/schemas/DeliveryError"
            - type: "null"
        response:
          oneOf:
            - $ref: "#/components/schemas/AttemptResponse"
            - type: "null"
        retry_at:
          type: [string, "null"]
          format: date-time
          description: When the next attempt was scheduled after this one failed, if any.
        classified_by:
          type: [string, "null"]
          description: |
            The upstream's classification rule that decided this attempt's outcome, or `null` when the
            default status-code rules applied.
          example: fake success

    AttemptResponse:
      type: object
      required: [headers, body, body_truncated]
      properties:
        headers:
          $ref: "#/components/schemas/Headers"
        body:
          type: string
          description: The response body, truncated to the configured limit (64 KiB by default).
        body_truncated:
          type: boolean

    AttemptList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"

    DLQGroup:
      type: object
      required: [upstream, error_code, count, oldest_dead_at, newest_dead_at]
      properties:
        upstream:
          $ref: "#/components/schemas/UpstreamName"
        error_code:
          $ref: "#/components/schemas/DeliveryErrorCode"
        status_code:
          type: [integer, "null"]
          description: The final HTTP status code, for `http_status` errors.
        count:
          type: integer
        oldest_dead_at:
          type: string
          format: date-time
        newest_dead_at:
          type: string
          format: date-time

    DLQSummary:
      type: object
      required: [total, groups]
      properties:
        total:
          type: integer
          description: Total number of dead requests matching the filter.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DLQGroup"

    DLQReplayRequest:
      type: object
      additionalProperties: false
      properties:
        upstream:
          $ref: "#/components/schemas/UpstreamName"
        error_code:
          $ref: "#/components/schemas/DeliveryErrorCode"
        status_code:
          type: integer
        dead_after:
          type: string
          format: date-time
        dead_before:
          type: string
          format: date-time
        ids:
          type: array
          description: Only replay these requests.
          maxItems: 1000
          items:
            $ref: "#/components/schemas/RequestId"
        dry_run:
          type: boolean
          default: false
          description: Count matching requests without replaying them.

    DLQReplayResult:
      type: object
      required: [matched, replayed, dry_run]
      properties:
        matched:
          type: integer
          description: Dead requests that matched the filter.
        replayed:
          type: integer
          description: Requests queued again (0 for a dry run).
        dry_run:
          type: boolean

    Upstream:
      type: object
      required: [name, base_url, timeout, retry, header_names, limits, state, on_timeout]
      properties:
        name:
          $ref: "#/components/schemas/UpstreamName"
        base_url:
          type: string
          format: uri
          example: https://api.courier-x.example
        timeout:
          $ref: "#/components/schemas/Duration"
        retry:
          $ref: "#/components/schemas/EffectiveRetryPolicy"
        header_names:
          type: array
          description: Names of headers added to every request. Values are not returned because they often contain secrets.
          items: { type: string }
          example: [Authorization, X-Api-Version]
        limits:
          $ref: "#/components/schemas/UpstreamLimits"
        state:
          $ref: "#/components/schemas/UpstreamState"
        on_timeout:
          type: string
          enum: [unknown, retry]
          description: |
            What happens when a POST or PATCH was sent but no response arrived: `unknown` (wait for a
            person or the app to settle it) or `retry` (for upstreams that deduplicate).

    UpstreamState:
      type: object
      description: Live delivery state of the upstream on the Hookyard instance that answered.
      required: [status, breaker, breaker_since, pause, in_flight, available_tokens, throttled_until]
      properties:
        status:
          type: string
          description: |
            - `active`: deliveries flow normally
            - `paused`: paused by an operator (see `pause`)
            - `breaker_open`: the circuit breaker opened after failures; deliveries wait
            - `breaker_half_open`: probe requests are deciding whether to resume
            - `throttled`: held back after the upstream answered `429` with `Retry-After`
          enum: [active, paused, breaker_open, breaker_half_open, throttled]
        breaker:
          type: string
          enum: [closed, open, half_open, "off"]
        breaker_since:
          type: [string, "null"]
          format: date-time
          description: When the breaker entered its current state.
        pause:
          oneOf:
            - $ref: "#/components/schemas/UpstreamPause"
            - type: "null"
        in_flight:
          type: integer
          description: Deliveries to this upstream in progress right now.
        available_tokens:
          type: [integer, "null"]
          description: Requests the rate limit allows right now, or `null` without a rate limit.
        throttled_until:
          type: [string, "null"]
          format: date-time

    UpstreamPause:
      type: object
      required: [since, until, reason, by]
      properties:
        since: { type: string, format: date-time }
        until:
          type: [string, "null"]
          format: date-time
          description: When the pause ends on its own, or `null` until resumed.
        reason: { type: string }
        by:
          type: string
          description: Name of the API token that paused it.

    UpstreamEvent:
      type: object
      required: [id, at, kind, reason, actor, details]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        kind:
          type: string
          description: "`breaker_open`, `breaker_half_open`, `breaker_closed`, `paused` or `resumed`."
          example: breaker_open
        reason: { type: string, example: 5 consecutive failures }
        actor:
          type: string
          description: "`hookyard` for automatic changes, otherwise the API token name."
        details:
          type: object
          additionalProperties: true

    UpstreamLimits:
      type: object
      description: |
        Throttling for deliveries to this upstream, applied by each Hookyard instance. Requests over
        the limits wait in the queue.
      required: [rate_limit, burst, max_concurrency]
      properties:
        rate_limit:
          type: [string, "null"]
          description: Sustained rate, such as `10/s` or `600/m`, or `null` for unlimited.
          example: 10/s
        burst:
          type: [integer, "null"]
          description: Requests that may be sent at once after a quiet period, or `null` without a rate limit.
          example: 10
        max_concurrency:
          type: [integer, "null"]
          description: Maximum deliveries in flight at once, or `null` for unlimited.
          example: 4

    UpstreamList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Upstream"

    UpstreamStats:
      type: object
      required: [upstream, succeeded, failed_attempts, dead, success_rate, throughput_per_min, latency_ms, queue_depth, oldest_pending_age_seconds, dlq_size]
      properties:
        upstream:
          $ref: "#/components/schemas/UpstreamName"
        succeeded:
          type: integer
          description: Requests delivered successfully in the window.
        failed_attempts:
          type: integer
          description: Attempts that failed in the window (including ones that were retried).
        dead:
          type: integer
          description: Requests that moved to the DLQ in the window.
        success_rate:
          type: [number, "null"]
          description: "`succeeded / (succeeded + dead)` for the window, from 0 to 1, or `null` with no finished requests."
          minimum: 0
          maximum: 1
        throughput_per_min:
          type: number
          description: Attempts per minute, averaged over the window.
        latency_ms:
          $ref: "#/components/schemas/LatencyPercentiles"
        queue_depth:
          type: integer
          description: Requests currently `pending` or `failed` (waiting to be delivered).
        oldest_pending_age_seconds:
          type: [integer, "null"]
          description: Age of the oldest request waiting to be delivered.
        dlq_size:
          type: integer
          description: Requests currently in the DLQ.

    LatencyPercentiles:
      type: object
      description: Attempt latency percentiles in milliseconds, `null` when there were no attempts.
      required: [p50, p95, p99]
      properties:
        p50: { type: [number, "null"] }
        p95: { type: [number, "null"] }
        p99: { type: [number, "null"] }

    StatsOverview:
      type: object
      required: [window, data]
      properties:
        window:
          $ref: "#/components/schemas/Duration"
        data:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamStats"

    StatsBucket:
      type: object
      required: [start, succeeded, failed_attempts, dead, latency_ms]
      properties:
        start:
          type: string
          format: date-time
        succeeded: { type: integer }
        failed_attempts: { type: integer }
        dead: { type: integer }
        latency_ms:
          $ref: "#/components/schemas/LatencyPercentiles"

    StatsTimeseries:
      type: object
      required: [step, data]
      properties:
        upstream:
          oneOf:
            - $ref: "#/components/schemas/UpstreamName"
            - type: "null"
          description: The upstream, or `null` for all upstreams combined.
        step:
          $ref: "#/components/schemas/Duration"
        data:
          type: array
          items:
            $ref: "#/components/schemas/StatsBucket"

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, example: database }
              status: { type: string, enum: [ok, fail] }
              error: { type: string }

    ErrorCode:
      type: string
      description: Stable, machine-readable error code.
      enum:
        - bad_request
        - unauthorized
        - not_found
        - invalid_state
        - payload_too_large
        - validation_failed
        - unknown_upstream
        - internal

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable explanation. Do not parse it; use `code`.
            details:
              type: array
              description: Per-field problems, for `validation_failed`.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: Dotted path of the invalid field.
                    example: retry.max_attempts
                  message:
                    type: string

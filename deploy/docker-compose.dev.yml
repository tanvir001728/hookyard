# Local development dependencies. Start with `make dev-db`.
name: hookyard-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hookyard
      POSTGRES_PASSWORD: hookyard
      POSTGRES_DB: hookyard
    ports:
      - "${HOOKYARD_DEV_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookyard -d hookyard"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:

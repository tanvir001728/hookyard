name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  api:
    name: API spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint OpenAPI spec
        run: make api-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check generated API types are up to date
        run: pnpm check:generated
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build (with the embedded dashboard)
        run: make web build
      - name: Smoke test
        run: |
          ./bin/hookyard version
          # The dashboard must be embedded, not the "not built" placeholder.
          grep -aqF '<div id="root"></div>' bin/hookyard

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hookyard
          POSTGRES_PASSWORD: hookyard
          POSTGRES_DB: hookyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookyard -d hookyard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      HOOKYARD_TEST_DATABASE_URL: postgres://hookyard:hookyard@localhost:5432/hookyard?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Server end-to-end tests (real binaries, crash and restart)
        run: go test -tags e2e -count=1 -v ./e2e/
      - name: Build Hookyard with the dashboard
        run: make web build
      - name: Start Hookyard for the browser tests
        env:
          HOOKYARD_DATABASE_URL: postgres://hookyard:hookyard@localhost:5432/hookyard?sslmode=disable
          HOOKYARD_API_TOKENS: dev:hookyard-dev-token
          HOOKYARD_CONFIG: e2e/dashboard.yaml
          HOOKYARD_ADDR: 127.0.0.1:8080
          # A test-only secret, so the browser tests can see callbacks.
          HOOKYARD_CALLBACK_SECRETS: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
        run: |
          ./bin/flakyvendor -addr 127.0.0.1:9090 > "$RUNNER_TEMP/flakyvendor.log" 2>&1 &
          ./bin/hookyard serve > "$RUNNER_TEMP/hookyard.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hookyard.log"
          exit 1
      - name: Install Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Dashboard browser tests (desktop and mobile)
        working-directory: web
        env:
          HOOKYARD_E2E_URL: http://127.0.0.1:8080
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
      - name: Hookyard logs
        if: failure()
        run: cat "$RUNNER_TEMP/hookyard.log"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the quickstart stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for Hookyard
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: Quickstart request is retried and delivered
        run: |
          curl -fsS -X POST http://127.0.0.1:8080/v1/requests \
            -H "Authorization: Bearer hookyard-demo-token" \
            -d '{"upstream":"demo","method":"POST","path":"/orders?fail_first=1","body":{"order_id":1}}'
          for _ in $(seq 1 30); do
            status=$(curl -fsS "http://127.0.0.1:8080/v1/requests?limit=1" -H "Authorization: Bearer hookyard-demo-token" | jq -r '.data[0].status')
            if [ "$status" = "succeeded" ]; then echo "delivered"; exit 0; fi
            sleep 1
          done
          echo "::error::request was not delivered (status: $status)"
          exit 1
      - name: Dashboard and health check work in the image
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          test "$(docker inspect --format '{{.State.Health.Status}}' hookyard-hookyard-1)" = healthy || \
            docker compose -f deploy/docker-compose.yml exec -T hookyard /usr/local/bin/hookyard healthcheck
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hookyard
          POSTGRES_PASSWORD: hookyard
          POSTGRES_DB: hookyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookyard -d hookyard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdk/typescript/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check generated types are up to date
        run: pnpm check:generated
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build Hookyard and flakyvendor
        working-directory: .
        run: make build
      - name: Start Hookyard
        working-directory: .
        env:
          HOOKYARD_DATABASE_URL: postgres://hookyard:hookyard@localhost:5432/hookyard?sslmode=disable
          HOOKYARD_API_TOKENS: ci:hookyard-ci-token
          HOOKYARD_CONFIG: ${{ runner.temp }}/hookyard.yaml
          HOOKYARD_ADDR: 127.0.0.1:8080
        run: |
          cat > "$HOOKYARD_CONFIG" <<'EOF'
          upstreams:
            flaky:
              base_url: http://127.0.0.1:9090
              retry:
                preset: quick
                max_attempts: 2
                initial_interval: 100ms
          EOF
          ./bin/flakyvendor -addr 127.0.0.1:9090 > "$RUNNER_TEMP/flakyvendor.log" 2>&1 &
          ./bin/hookyard serve > "$RUNNER_TEMP/hookyard.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          echo "::error::Hookyard did not become ready"
          cat "$RUNNER_TEMP/hookyard.log"
          exit 1
      - name: Contract tests
        env:
          HOOKYARD_URL: http://127.0.0.1:8080
          HOOKYARD_TOKEN: hookyard-ci-token
          HOOKYARD_CONTRACT_REQUIRED: "1"
        run: pnpm test:contract
      - name: Server logs
        if: failure()
        working-directory: .
        run: cat "$RUNNER_TEMP/hookyard.log" "$RUNNER_TEMP/flakyvendor.log" || true
